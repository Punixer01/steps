<title>STEPS Premium Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap">

<style>
  :root{
    --navy:#1D2954;
    --navy-deep:#151D3B;
    --navy-soft:#26315C;
    --accent:#15A46B;
    --accent-rgb:21,164,107;
    --yellow:#FBDC32;
    --white:#FFFFFF;
    --muted:#8791B6;
    --grid:rgba(255,255,255,.06);
    --maxw:640px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--navy);color:var(--white);
    font-family:"Barlow Condensed",system-ui,sans-serif;font-size:18px;line-height:1.35;
    overflow-x:hidden;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--yellow);color:var(--navy)}
  button{font:inherit;color:inherit}
  img{display:block}

  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:44px 44px;background-position:center;
    -webkit-mask-image:radial-gradient(ellipse 120% 90% at 50% 0%,#000 55%,transparent 100%);
            mask-image:radial-gradient(ellipse 120% 90% at 50% 0%,#000 55%,transparent 100%)}

  /* logo badge */
  .logo{display:inline-grid;place-items:center;background:var(--accent);border-radius:26px}
  .logo svg{height:100%;width:auto;display:block}
  .logo.lg{width:122px;height:122px;padding:20px 22px}
  .logo.md{width:88px;height:88px;padding:14px 16px}

  /* ===================== CINEMATIC LOADER ===================== */
  #loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(16px,3.4vh,30px);background:radial-gradient(120% 80% at 50% 8%, #26315C 0%, var(--navy) 45%, var(--navy-deep) 100%);
    padding:24px;text-align:center;transition:opacity .7s ease, visibility .7s ease}
  #loader.done{opacity:0;visibility:hidden;pointer-events:none}
  .scene{position:relative;width:min(66vw,260px);aspect-ratio:3/3.3;background:var(--navy-deep);
    border:3px solid var(--yellow);border-radius:140px 140px 24px 24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .stars i{position:absolute;color:var(--yellow);font-size:13px;opacity:0;animation:twinkle 2.6s ease-in-out infinite}
  .stars i:nth-child(1){top:20%;left:18%;animation-delay:.2s}
  .stars i:nth-child(2){top:38%;left:74%;animation-delay:.9s;font-size:17px}
  .stars i:nth-child(3){top:14%;left:60%;animation-delay:1.5s;font-size:10px}
  .stars i:nth-child(4){top:52%;left:12%;animation-delay:1.1s;font-size:10px}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
  .moon{position:absolute;left:50%;top:44%;width:66px;height:66px;border-radius:50%;background:var(--white);
    transform:translate(-50%,40px);opacity:0;box-shadow:0 0 46px rgba(255,255,255,.35);
    animation:moonRise 2s cubic-bezier(.2,.8,.25,1) .3s forwards}
  @keyframes moonRise{to{opacity:1;transform:translate(-50%,-6px)}}
  .dune{position:absolute;left:-5%;right:-5%;bottom:-2px;height:34%;background:var(--yellow);
    border-radius:50% 50% 0 0 / 90% 90% 0 0;transform:translateY(60%);animation:duneUp 1.1s ease .2s forwards}
  @keyframes duneUp{to{transform:translateY(28%)}}
  .glass{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);width:86px;height:66px;z-index:2}
  .glass .bowl{position:absolute;top:0;left:0;width:86px;height:46px;background:var(--accent);
    -webkit-clip-path:polygon(0 0,100% 0,50% 100%);clip-path:polygon(0 0,100% 0,50% 100%);
    transform:scaleY(0);transform-origin:top;animation:pour 1s ease 1.1s forwards}
  .glass .stem{position:absolute;top:46px;left:41px;width:3px;height:18px;background:var(--accent)}
  .glass .foot{position:absolute;top:62px;left:31px;width:24px;height:3px;background:var(--accent)}
  @keyframes pour{to{transform:scaleY(1)}}

  .logo.lg{opacity:0;transform:translateY(20px) scale(.85);animation:logoIn .7s cubic-bezier(.2,.9,.3,1.2) .5s forwards}
  @keyframes logoIn{to{opacity:1;transform:none}}
  .l-name{font-family:"Bungee",sans-serif;color:var(--yellow);letter-spacing:.34em;font-size:20px;
    opacity:0;animation:fadeIn .6s ease 1s forwards}
  .loader-tag{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.42em;
    font-weight:600;font-size:12px;color:var(--white);opacity:0;animation:fadeIn .6s ease 1.2s forwards}
  .bar{width:min(58vw,220px);height:6px;border-radius:20px;background:rgba(255,255,255,.12);overflow:hidden;
    opacity:0;animation:fadeIn .5s ease 1.1s forwards}
  .bar b{display:block;height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--yellow));
    animation:load 2.3s cubic-bezier(.5,0,.2,1) 1.1s forwards}
  @keyframes load{to{width:100%}}
  @keyframes fadeIn{to{opacity:1}}
  .enter-btn{margin-top:2px;font-family:"Bungee",sans-serif;font-size:16px;letter-spacing:.5px;color:var(--navy);
    background:var(--yellow);border:none;border-radius:60px;padding:15px 40px;cursor:pointer;opacity:0;
    transform:translateY(10px) scale(.96);pointer-events:none;transition:transform .18s ease, box-shadow .18s ease;
    box-shadow:0 10px 0 rgba(0,0,0,.28), 0 16px 30px rgba(0,0,0,.35)}
  .enter-btn.show{opacity:1;transform:none;pointer-events:auto;animation:pulse 2.4s ease-in-out .4s infinite}
  .enter-btn:hover{transform:translateY(-2px)}
  .enter-btn:active{transform:translateY(4px);box-shadow:0 6px 0 rgba(0,0,0,.28)}
  @keyframes pulse{0%,100%{box-shadow:0 10px 0 rgba(0,0,0,.28),0 16px 30px rgba(0,0,0,.35)}
    50%{box-shadow:0 10px 0 rgba(0,0,0,.28),0 16px 46px rgba(var(--accent-rgb),.45)}}

  /* ===================== PAGE ===================== */
  .app{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;
    padding:0 clamp(14px,4vw,22px) 70px;opacity:0;visibility:hidden}
  .app.on{opacity:1;visibility:visible;animation:appIn .7s ease}
  @keyframes appIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .hero{position:relative;text-align:center;padding:clamp(22px,6vw,44px) 12px clamp(10px,3vw,20px);
    display:flex;flex-direction:column;align-items:center;gap:12px}
  .hero .brand{font-family:"Bungee",sans-serif;color:var(--yellow);letter-spacing:.28em;font-size:clamp(20px,6vw,30px)}
  .menu-pill{font-family:"Bungee",sans-serif;font-size:12px;letter-spacing:.36em;color:var(--navy);
    background:var(--yellow);padding:8px 24px 7px;border-radius:40px;margin-top:2px}
  .hero h1{margin:2px 0 0;font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(56px,20vw,120px);line-height:.9;
    color:var(--yellow);-webkit-text-stroke:clamp(3px,1.1vw,7px) var(--navy-deep);paint-order:stroke fill;
    text-shadow:0 8px 0 rgba(0,0,0,.22);letter-spacing:1px}
  .hours{margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.28em;font-size:12px;color:var(--white)}
  .hours b{color:var(--yellow);font-size:20px;letter-spacing:.1em;font-weight:700}
  .hours .sep{display:inline-block;width:30px;height:3px;background:var(--accent);vertical-align:middle;margin:0 10px;border-radius:3px}

  /* sticky category nav (text, no boxes) */
  .catnav{position:sticky;top:0;z-index:20;display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;
    padding:12px 2px 11px;margin:10px 0 6px;
    background:linear-gradient(var(--navy) 76%,rgba(29,41,84,0));-webkit-overflow-scrolling:touch}
  .catnav::-webkit-scrollbar{display:none}
  .catnav a{flex:0 0 auto;text-decoration:none;white-space:nowrap;color:var(--muted);
    font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:13px;
    padding-bottom:3px;border-bottom:2px solid transparent;transition:.15s}
  .catnav a:hover,.catnav a:focus-visible{color:var(--yellow);outline:none}
  .catnav a.on{color:var(--yellow);border-bottom-color:var(--accent)}

  /* sections */
  .sec{scroll-margin-top:64px;margin:26px 0 4px;opacity:0;transform:translateY(20px)}
  .sec.in{animation:secIn .6s cubic-bezier(.2,.8,.25,1) forwards}
  @keyframes secIn{to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:baseline;gap:12px;background:var(--accent);border-radius:10px;
    padding:9px 16px;margin:0 0 12px}
  .sec-head h2{margin:0;font-family:"Bungee",sans-serif;font-size:clamp(15px,4.4vw,20px);color:var(--white)}
  .sec-note{margin-left:auto;font-weight:600;letter-spacing:.12em;font-size:12px;text-transform:uppercase;color:rgba(255,255,255,.9)}

  ul.items{list-style:none;margin:0;padding:0 2px}
  ul.items li{display:flex;align-items:baseline;gap:10px;padding:9px 2px}
  ul.items li + li{border-top:1px dashed rgba(255,255,255,.09)}
  .nm{text-transform:uppercase;letter-spacing:.02em;font-weight:500;font-size:19px}
  .dots{flex:1;border-bottom:2px dotted rgba(255,255,255,.18);transform:translateY(-4px)}
  .pr{font-weight:700;font-size:20px;color:var(--yellow);font-variant-numeric:tabular-nums;letter-spacing:.02em}

  .grid-head{display:grid;gap:5px;align-items:end;margin:2px 2px 6px}
  .grid-head span{text-align:center;font-family:"Bungee",sans-serif;font-size:10px;color:var(--navy);
    background:var(--yellow);border-radius:5px;padding:4px 0}
  .grid-head .lbl{background:none}
  ul.gitems{list-style:none;margin:0;padding:0 2px}
  ul.gitems li{display:grid;gap:5px;align-items:center;padding:10px 2px}
  ul.gitems li + li{border-top:1px dashed rgba(255,255,255,.09)}
  ul.gitems .nm{font-size:17px}
  ul.gitems .cell{text-align:center;font-weight:700;font-size:16px;color:var(--yellow);font-variant-numeric:tabular-nums;
    background:rgba(255,255,255,.05);border-radius:6px;padding:6px 0}
  ul.gitems .cell.na{color:var(--muted);background:transparent}

  .note{text-align:center;padding:8px 6px 2px}
  .note-price{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(56px,18vw,96px);line-height:1;
    color:var(--yellow);-webkit-text-stroke:clamp(3px,1vw,6px) var(--navy-deep);paint-order:stroke fill}
  .note-price small{display:block;font-family:"Bungee",sans-serif;-webkit-text-stroke:0;font-size:14px;letter-spacing:.3em;color:var(--accent);margin-top:6px}
  .note-text{max-width:34ch;margin:14px auto 2px;color:var(--white);opacity:.85;font-size:17px}

  .foot{text-align:center;margin-top:44px;color:var(--muted)}
  .foot .logo{margin:0 auto 12px;width:60px;height:60px;padding:11px;border-radius:16px}
  .foot p{margin:8px 0 0;font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
  .foot .cur{color:var(--yellow)}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
    .moon,.dune,.glass .bowl,.logo.lg,.sec{opacity:1!important;transform:none!important}
  }
</style>

<div class="grid-bg" aria-hidden="true"></div>

  <div class="scene" aria-hidden="true">
    <div class="stars"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>
    <div class="moon"></div>
    <div class="glass"><span class="bowl"></span><span class="stem"></span><span class="foot"></span></div>

  </div>
  <div class="logo lg"><svg class="bird" viewBox="0 0 688 900" xmlns="http://www.w3.org/2000/svg" aria-label="STEPS logo" role="img"><path fill="#fff" fill-rule="evenodd" d="M340.0,150.0 255.0,143.0 101.0,159.0 63.0,188.0 53.0,212.0 74.0,385.0 174.0,248.0 180.0,219.0 171.0,188.0 182.0,179.0 327.0,176.0 370.0,195.0 397.0,225.0 397.0,268.0 379.0,304.0 286.0,397.0 190.0,467.0 88.0,517.0 98.0,543.0 161.0,597.0 208.0,617.0 274.0,625.0 219.0,799.0 172.0,793.0 137.0,803.0 124.0,822.0 125.0,850.0 211.0,846.0 235.0,832.0 311.0,609.0 429.0,761.0 391.0,790.0 383.0,826.0 493.0,813.0 344.0,605.0 412.0,551.0 447.0,495.0 467.0,434.0 467.0,367.0 303.0,422.0 395.0,331.0 431.0,252.0 413.0,197.0 385.0,169.0Z"/></svg></div>
  <div class="l-name">STEPS</div>
  <div class="loader-tag">Pouring the night</div>
  <div class="bar"><b></b></div>
  <button class="enter-btn" id="enterBtn">ENTER</button>
</div>

<main class="app" id="app">
  <header class="hero">
    <div class="logo md"><svg class="bird" viewBox="0 0 688 900" xmlns="http://www.w3.org/2000/svg" aria-label="STEPS logo" role="img"><path fill="#fff" fill-rule="evenodd" d="M340.0,150.0 255.0,143.0 101.0,159.0 63.0,188.0 53.0,212.0 74.0,385.0 174.0,248.0 180.0,219.0 171.0,188.0 182.0,179.0 327.0,176.0 370.0,195.0 397.0,225.0 397.0,268.0 379.0,304.0 286.0,397.0 190.0,467.0 88.0,517.0 98.0,543.0 161.0,597.0 208.0,617.0 274.0,625.0 219.0,799.0 172.0,793.0 137.0,803.0 124.0,822.0 125.0,850.0 211.0,846.0 235.0,832.0 311.0,609.0 429.0,761.0 391.0,790.0 383.0,826.0 493.0,813.0 344.0,605.0 412.0,551.0 447.0,495.0 467.0,434.0 467.0,367.0 303.0,422.0 395.0,331.0 431.0,252.0 413.0,197.0 385.0,169.0Z"/></svg></div>
    <div class="brand">STEPS</div>
    <span class="menu-pill">MENU</span>
    <h1>DRINKS</h1>
    <div class="hours">Open Hours &nbsp; <b>10PM</b><span class="sep"></span><b>05AM</b></div>
  </header>

  <nav class="catnav" id="catnav" aria-label="Menu categories"></nav>

    <p>Open 10PM — 05AM &nbsp;•&nbsp; <span class="cur">All prices in TND</span></p>
  </footer>
</main>

<script>
(function(){
  var DATA = [{"id": "cocktails", "name": "Cocktails", "kind": "note", "price": 25, "note": "Our mixologist’s selection — ask your bartender for tonight’s list."}, {"id": "mocktails", "name": "Mocktails", "kind": "note", "price": 20, "note": "Alcohol-free — same craft, zero proof."}, {"id": "whisky", "name": "Whisky", "kind": "grid", "cols": ["Verre", "100CL", "50CL"], "items": [["Johnnie Walker Red Label", [25, 300, 150]], ["Johnnie Walker Black Label", [25, 450, 225]], ["Jack Daniel’s", [25, 300, 150]]]}, {"id": "vodka", "name": "Vodka", "kind": "grid", "cols": ["Verre", "100CL", "50CL"], "items": [["Smirnoff", [20, 300, 150]], ["Absolut", [20, 300, 150]]]}, {"id": "gin", "name": "Gin", "kind": "grid", "cols": ["Verre", "100CL", "50CL"], "items": [["Gordon’s", [20, 300, 150]]]}, {"id": "rouge", "name": "Vin Rouge", "sub": "Red wine", "kind": "list", "items": [["Magnifique", 70], ["Soltan", 70], ["Selian", 70]]}, {"id": "rose", "name": "Vin Rosé", "sub": "Rosé wine", "kind": "list", "items": [["Magnifique", 70], ["Soltan", 70], ["Selian", 70]]}, {"id": "blanc", "name": "Vin Blanc", "sub": "White wine", "kind": "list", "items": [["Magnifique", 70], ["Soltan", 70], ["Selian", 70]]}, {"id": "beer", "name": "Beer", "kind": "list", "items": [["Celtia", 10], ["Beck’s", 10]]}, {"id": "soft", "name": "Soft Drinks", "kind": "list", "items": [["Eau 1L", 10], ["Coca", 10], ["Boga", 10], ["Fanta", 10], ["Energy Drink", 20]]}];

  var nav=document.getElementById("catnav"), main=document.getElementById("sections");

  DATA.forEach(function(d){
    var a=document.createElement("a"); a.href="#"+d.id; a.textContent=d.name; a.dataset.id=d.id; nav.appendChild(a);

    var sec=document.createElement("section"); sec.className="sec"; sec.id=d.id;
    var html='<div class="sec-head"><h2>'+d.name+'</h2>'+(d.sub?'<span class="sec-note">'+d.sub+'</span>':'')+'</div>';
    if(d.kind==="note"){
      html+='<div class="note"><div class="note-price">'+d.price+'<small>DT</small></div><p class="note-text">'+d.note+'</p></div>';
    }else if(d.kind==="grid"){
      var n=d.cols.length, cw=(n>=4?"46px":"60px"), tmpl="1fr repeat("+n+","+cw+")";
      html+='<div class="grid-head" style="grid-template-columns:'+tmpl+'"><span class="lbl"></span>'+
        d.cols.map(function(c){return '<span>'+c+'</span>';}).join("")+'</div><ul class="gitems">';
      d.items.forEach(function(it){
        html+='<li style="grid-template-columns:'+tmpl+'"><span class="nm">'+it[0]+'</span>'+
          it[1].map(function(v){return '<span class="cell'+(v==="–"?" na":"")+'">'+v+'</span>';}).join("")+'</li>';
      });
      html+='</ul>';
    }else{
      html+='<ul class="items">';
      d.items.forEach(function(it){
        html+='<li><span class="nm">'+it[0]+'</span><span class="dots"></span><span class="pr">'+it[1]+'</span></li>';
      });
      html+='</ul>';
    }
    sec.innerHTML=html; main.appendChild(sec);
  });

  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var secs=[].slice.call(document.querySelectorAll(".sec"));
  var links={}; [].forEach.call(nav.querySelectorAll("a"),function(a){links[a.dataset.id]=a;});

  function reveal(){
    if(reduce){ secs.forEach(function(s){s.classList.add("in");}); return; }
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
    },{threshold:.12,rootMargin:"0px 0px -6% 0px"});
    secs.forEach(function(s){io.observe(s);});
    // scroll-spy for nav highlight
    var spy=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){
        for(var k in links) links[k].classList.remove("on");
        if(links[e.target.id]) links[e.target.id].classList.add("on");
      }});
    },{rootMargin:"-45% 0px -50% 0px"});
    secs.forEach(function(s){spy.observe(s);});
  }

  var loader=document.getElementById("loader"), app=document.getElementById("app"),
      enterBtn=document.getElementById("enterBtn");
  function enter(){
    if(loader.classList.contains("done"))return;
    loader.classList.add("done"); app.classList.add("on"); reveal(); window.scrollTo(0,0);
  }
  if(reduce){ document.querySelector(".loader-tag").textContent="Tap to enter"; enterBtn.classList.add("show"); }
  else{ setTimeout(function(){enterBtn.classList.add("show");},3200);
        setTimeout(function(){if(!loader.classList.contains("done"))enter();},9000); }
  enterBtn.addEventListener("click",enter);
})();
</script>
